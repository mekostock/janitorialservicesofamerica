name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "mekostock"
          git config user.email "mekostock@users.noreply.github.com"
          git mv janitorial-services-of-america-website.html index.html
          git commit -m "Rename new website file to index.html"
          git push
